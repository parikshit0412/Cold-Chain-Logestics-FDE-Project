services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cold-chain-fde-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    extra_hosts:
      # Allows the container to reach a SQL Server instance running on your host machine
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
